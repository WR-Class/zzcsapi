<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZZCSAPI 控制台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #0f1115; color: #d8dde6; }
  header { padding: 14px 22px; background: #181c25; border-bottom: 1px solid #2a2f3d; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .meta { color: #8a93a6; font-size: 12px; }
  .toolbar { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  button, select, input[type=text], input[type=number], input[type=password], textarea { background: #1f2430; color: #d8dde6; border: 1px solid #2c3140; border-radius: 6px; padding: 6px 12px; font: inherit; }
  textarea { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; padding: 8px 10px; resize: vertical; }
  button { cursor: pointer; }
  button:hover { background: #2a3140; }
  button.primary { background: #3a7afe; border-color: #3a7afe; color: white; }
  button.primary:hover { background: #4d88ff; }
  button.danger { background: #c13a3a; border-color: #c13a3a; color: white; }
  button.danger:hover { background: #d04a4a; }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  main { padding: 18px 22px; }
  h2 { font-size: 15px; margin: 22px 0 10px; color: #aab1c2; display: flex; align-items: center; gap: 10px; }
  h2 .hint { color: #6e7691; font-size: 11px; font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .card { background: #181c25; border: 1px solid #262b38; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .card h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12.5px; gap: 8px; }
  .card .row .k { color: #8a93a6; flex-shrink: 0; }
  .card .row .v { text-align: right; word-break: break-all; max-width: 70%; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; }
  .dot.ok { background: #3ddc97; }
  .dot.degraded { background: #f5b94a; }
  .dot.down { background: #e15759; }
  .dot.unknown { background: #6e7691; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; background: #2a3140; color: #cbd2e0; }
  .badge.openai { background: #103a23; color: #79e6b3; }
  .badge.anthropic { background: #4a2a18; color: #ffb68a; }
  .badge.gemini { background: #1a2c4a; color: #8ab4ff; }
  .alias-list { max-height: 110px; overflow: auto; background: #11141b; border-radius: 6px; padding: 6px 8px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.5px; }
  .alias-list .pair { display: flex; justify-content: space-between; gap: 8px; }
  .alias-list .pair .up { color: #6e7691; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .actions button { padding: 3px 8px; font-size: 12px; }
  .prio { display: flex; align-items: center; gap: 4px; }
  .prio input { width: 60px; padding: 3px 6px; }
  .err { color: #e15759; font-size: 11.5px; margin-top: 4px; }
  .empty { color: #6e7691; font-size: 12px; padding: 20px; text-align: center; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: #2a3140; color: #d8dde6; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 1000; max-width: 50vw; }
  .toast.show { opacity: 1; }
  .refresh-hint { color: #6e7691; font-size: 11px; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .mask.show { display: flex; }
  .modal { background: #181c25; border: 1px solid #2c3140; border-radius: 10px; padding: 18px 20px; width: 100%; max-width: 620px; max-height: 90vh; overflow: auto; box-shadow: 0 18px 50px rgba(0,0,0,0.4); }
  .modal h2 { margin: 0 0 12px; color: #d8dde6; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { color: #8a93a6; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .help { color: #6e7691; font-size: 11px; }
  .probe-box { background: #11141b; border: 1px solid #2c3140; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .probe-box .probe-row { display: flex; gap: 8px; align-items: center; }
  .probe-box .probe-row .grow { flex: 1; color: #8a93a6; font-size: 12px; }
  .model-row { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 4px; padding: 4px 6px; align-items: center; border-bottom: 1px solid #1c2030; }
  .model-row:last-child { border-bottom: none; }
  .model-row.head { color: #8a93a6; font-size: 11px; padding: 6px; background: #181c25; }
  .model-row input { background: #0f1219; border: 1px solid #2c3140; border-radius: 4px; padding: 4px 8px; font: inherit; font-size: 12.5px; color: #d8dde6; }
  .model-row input:focus { border-color: #3a7afe; outline: none; }
  .model-row .arrow { color: #6e7691; text-align: center; font-size: 12px; }
  .model-row .del { background: transparent; border: 1px solid #2c3140; color: #e15759; border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  .model-row .del:hover { background: #2a1818; }
  .model-row .test { background: transparent; border: 1px solid #2c3140; color: #8ab4ff; border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  .model-row .test:hover { background: #1a2238; }
  .model-empty { padding: 20px; text-align: center; color: #6e7691; font-size: 12px; }
  .model-list { max-height: 220px; overflow: auto; border: 1px solid #2c3140; border-radius: 6px; padding: 4px; background: #11141b; margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px; }
  .model-list label { display: flex; gap: 6px; align-items: center; padding: 4px 6px; font-size: 12px; cursor: pointer; border-radius: 4px; }
  .model-list label:hover { background: #1a1f29; }
  .model-list input { accent-color: #3a7afe; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: #3a7afe; }
  .small { font-size: 11px; color: #6e7691; }
  .hidden { display: none; }
  .access-box { background: #181c25; border: 1px solid #262b38; border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
  .access-box h2 { margin: 0 0 10px; color: #d8dde6; font-size: 15px; }
  .access-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .access-item { background: #11141b; border: 1px solid #2c3140; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  .access-item .label { color: #8a93a6; font-size: 11.5px; }
  .access-item .val { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  .access-item .row { display: flex; gap: 6px; align-items: center; }
  .access-item .row .val { flex: 1; }
  .copy-btn { background: #2a3140; border: 1px solid #2c3140; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; color: #cbd2e0; }
  .copy-btn:hover { background: #353c4d; }
  .copy-btn.ok { background: #2c5f3a; border-color: #2c5f3a; color: white; }
  .recheck-log { margin-top: 8px; padding: 8px 10px; background: #11141b; border: 1px solid #2c3140; border-radius: 6px; font-size: 12px; max-height: 180px; overflow: auto; }
  .recheck-log .ok { color: #79e6b3; }
  .recheck-log .fail { color: #e15759; }
  .recheck-log .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
</style>
</head>
<body>
<header>
  <h1>ZZCSAPI 控制台</h1>
  <span class="meta" id="meta">—</span>
  <div class="toolbar">
    <button id="btn-refresh">刷新</button>
    <button id="btn-recheck" class="primary">立即探测全部</button>
    <button id="btn-test-model" class="primary">🧪 测试模型</button>
    <button id="btn-add" class="primary">+ 添加渠道</button>
  </div>
</header>
<main>
  <div class="access-box">
    <h2>本地接入 <span class="hint" id="access-hint"></span></h2>
    <div class="access-grid" id="access-grid">
      <div class="access-item"><span class="label">OpenAI 兼容 baseURL</span>
        <div class="row"><span class="val" id="acc-openai">—</span><button class="copy-btn" data-copy="acc-openai">复制</button></div></div>
      <div class="access-item"><span class="label">Anthropic 兼容 baseURL</span>
        <div class="row"><span class="val" id="acc-anthropic">—</span><button class="copy-btn" data-copy="acc-anthropic">复制</button></div></div>
      <div class="access-item"><span class="label">Gemini 兼容 baseURL</span>
        <div class="row"><span class="val" id="acc-gemini">—</span><button class="copy-btn" data-copy="acc-gemini">复制</button></div></div>
      <div class="access-item"><span class="label">客户端 Key <span class="small" id="acc-gw-req"></span></span>
        <div class="row"><span class="val" id="acc-gwkey">—</span><button class="copy-btn" data-copy="acc-gwkey">复制</button></div></div>
      <div class="access-item"><span class="label">控制台 Key</span>
        <div class="row"><span class="val" id="acc-adminkey">—</span><button class="copy-btn" data-copy="acc-adminkey">复制</button></div></div>
      <div class="access-item"><span class="label">控制台地址</span>
        <div class="row"><span class="val" id="acc-console">—</span><button class="copy-btn" data-copy="acc-console">复制</button></div></div>
    </div>
    <div class="small" id="access-warning" style="margin-top:8px"></div>
  </div>
  <h2>渠道 <span class="hint" id="refresh-hint"></span></h2>
  <div id="channels" class="grid"></div>
  <h2>聚合模型</h2>
  <div id="models"></div>
</main>
<div class="toast" id="toast"></div>

<div class="mask" id="mask">
  <div class="modal">
    <h2 id="modal-title">添加渠道</h2>

    <div class="field">
      <label>渠道 ID <span class="help">（英文/数字/下划线/短横线）</span></label>
      <input id="f-id" type="text" placeholder="vendor-x">
    </div>
    <div class="field">
      <label>显示名称</label>
      <input id="f-name" type="text" placeholder="中转 X">
    </div>
    <div class="field-row">
      <div class="field">
        <label>协议</label>
        <select id="f-protocol">
          <option value="openai">openai</option>
          <option value="anthropic">anthropic</option>
          <option value="gemini">gemini</option>
        </select>
      </div>
      <div class="field">
        <label>优先级</label>
        <input id="f-priority" type="number" value="0">
      </div>
      <div class="field" style="flex:0 0 100px">
        <label>启用</label>
        <select id="f-enabled">
          <option value="true">是</option>
          <option value="false">否</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Base URL <span class="help">（不含尾斜杠。openai 通常 https://host/v1，anthropic https://host，gemini https://generativelanguage.googleapis.com）</span></label>
      <input id="f-baseUrl" type="text" placeholder="https://api.example.com/v1">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="f-apiKey" type="password" placeholder="sk-...">
    </div>

    <!-- 模型列表（行式编辑器） -->
    <div class="field">
      <label>模型 <span class="small" id="models-count">— 0 个</span></label>
      <div class="probe-row" style="margin-bottom:6px">
        <button id="btn-add-model" type="button">+ 添加一行</button>
        <button id="btn-probe" type="button" class="primary">🔍 探测获取</button>
        <span class="grow small" id="probe-status"></span>
      </div>
      <div id="models-editor" style="border:1px solid #2c3140;border-radius:6px;background:#11141b;max-height:260px;overflow:auto"></div>
      <div class="small" id="probe-add-list" style="display:none;margin-top:6px"></div>
    </div>

    <div class="field">
      <label class="toggle"><input type="checkbox" id="f-autoAlias"> 自动路由上游所有模型（不勾则只暴露上表里列的）</label>
    </div>

    <div class="modal-actions">
      <button id="btn-cancel" class="ghost">取消</button>
      <button id="btn-save" class="primary">保存</button>
    </div>
  </div>
</div>

<div class="mask" id="test-mask">
  <div class="modal" style="max-width:560px">
    <h2>测试模型 <span class="small" id="test-modal-subtitle"></span></h2>
    <div class="field">
      <div class="probe-row">
        <span class="grow small" id="test-summary">—</span>
        <label class="toggle"><input type="checkbox" id="test-select-all" checked> 全选</label>
      </div>
    </div>
    <div id="test-model-list" style="max-height:50vh;overflow:auto;border:1px solid #2c3140;border-radius:6px;background:#11141b;padding:6px;margin-bottom:12px"></div>
    <div class="field">
      <label>提示词 <span class="small">（默认 "hi"，可改成你自己的简短测试）</span></label>
      <input id="test-prompt" type="text" value="hi">
    </div>
    <div class="modal-actions">
      <button id="test-cancel" class="ghost">取消</button>
      <button id="test-run" class="primary">运行测试</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
function err(msg) { toast('⚠️ ' + msg); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const k = sessionStorage.getItem('adminKey');
  if (k) headers['Authorization'] = 'Bearer ' + k;
  const r = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  if (r.status === 401) { err('未授权'); throw new Error('401'); }
  const j = await r.json().catch(() => null);
  if (!r.ok) { err(j && (j.error || j.message) || ('HTTP ' + r.status)); throw new Error('http ' + r.status); }
  return j;
}

const state = { channels: [], probedModels: [] };

function statusBadge(s) {
  const map = { ok: '正常', degraded: '降级', down: '不可用', unknown: '未知' };
  return `<span class="dot ${s}"></span><span>${map[s] || s}</span>`;
}
function protocolBadge(p) { return `<span class="badge ${p}">${p}</span>`; }

function renderChannels(data) {
  state.channels = data.channels;
  const root = $('#channels');
  if (!data.channels.length) { root.innerHTML = '<div class="empty" style="grid-column:1/-1">尚未配置渠道。点右上角"+ 添加渠道"开始。</div>'; return; }
  root.innerHTML = data.channels.map((ch) => {
    const aliases = ch.aliases.map(a => `<div class="pair"><span>${escapeHtml(a.alias)}</span><span class="up">→ ${escapeHtml(a.upstream)}</span></div>`).join('') || '<div class="empty">无别名</div>';
    const err1 = ch.lastError ? `<div class="err">${escapeHtml(ch.lastError)}</div>` : '';
    const checked = ch.lastCheck ? new Date(ch.lastCheck).toLocaleTimeString() : '—';
    return `
      <div class="card" data-id="${escapeHtml(ch.id)}">
        <h3>${protocolBadge(ch.protocol)} ${escapeHtml(ch.name)} <span class="badge">${escapeHtml(ch.id)}</span></h3>
        <div class="row"><span class="k">状态</span><span class="v">${statusBadge(ch.status)}</span></div>
        <div class="row"><span class="k">端点</span><span class="v">${escapeHtml(ch.baseUrl)}</span></div>
        <div class="row"><span class="k">延迟</span><span class="v">${ch.latencyMs < 0 ? '—' : ch.latencyMs + ' ms'}</span></div>
        <div class="row"><span class="k">探测时间</span><span class="v">${checked}</span></div>
        <div class="row"><span class="k">上游模型</span><span class="v">${ch.upstreamModels.length}</span></div>
        <div class="row"><span class="k">别名</span><span class="v">${ch.aliases.length}</span></div>
        <div class="alias-list">${aliases}</div>
        ${err1}
        <div class="actions">
          <div class="prio">
            <span class="k">优先级</span>
            <input type="text" value="${ch.priority}" data-edit="priority">
          </div>
          <button data-act="save-prio">保存</button>
          <button data-act="probe">探测</button>
          <button data-act="test">🧪 测试</button>
          <button data-act="edit">编辑</button>
          <button data-act="toggle" class="${ch.enabled ? '' : 'primary'}">${ch.enabled ? '停用' : '启用'}</button>
          <button data-act="delete" class="danger">删除</button>
        </div>
      </div>
    `;
  }).join('');

  $$('.card').forEach((card) => {
    const id = card.dataset.id;
    card.querySelector('[data-act=save-prio]').onclick = async () => {
      const priority = Number(card.querySelector('[data-edit=priority]').value);
      if (Number.isNaN(priority)) return err('优先级必须为数字');
      await api('/admin/api/channel', { method: 'POST', body: JSON.stringify({ id, priority }) });
      toast('已保存优先级'); refresh();
    };
    card.querySelector('[data-act=probe]').onclick = async () => {
      await api('/admin/api/recheck', { method: 'POST', body: JSON.stringify({ id }) });
      toast('已探测'); refresh();
    };
    card.querySelector('[data-act=test]').onclick = () => {
      const ch = state.channels.find(c => c.id === id);
      openTestModal({ restrictChannelId: id, ch });
    };
    card.querySelector('[data-act=edit]').onclick = () => openModal(state.channels.find(c => c.id === id));
    card.querySelector('[data-act=toggle]').onclick = async () => {
      const cur = state.channels.find(c => c.id === id);
      await api('/admin/api/channel', { method: 'POST', body: JSON.stringify({ id, enabled: !cur.enabled }) });
      toast(cur.enabled ? '已停用' : '已启用'); refresh();
    };
    card.querySelector('[data-act=delete]').onclick = async () => {
      if (!confirm('确定要删除渠道 “' + id + '” 吗？')) return;
      await api('/admin/api/channels', { method: 'DELETE', body: JSON.stringify({ id }) });
      toast('已删除'); refresh();
    };
  });
}

function renderModels(data) {
  const root = $('#models');
  const sections = [];
  for (const [proto, list] of Object.entries(data.aggregated)) {
    if (!list.length) continue;
    sections.push(`
      <div class="card" style="margin-bottom:12px">
        <h3>${protocolBadge(proto)} <span>${list.length} 个模型</span></h3>
        <div class="alias-list" style="max-height:none">${list.map(m => `<div class="pair"><span>${escapeHtml(m)}</span></div>`).join('')}</div>
      </div>
    `);
  }
  root.innerHTML = sections.join('') || '<div class="empty">无模型</div>';
}

let accessCfg = null;
function renderAccess(cfg) {
  accessCfg = cfg;
  $('#acc-openai').textContent = cfg.urls.openai;
  $('#acc-anthropic').textContent = cfg.urls.anthropic;
  $('#acc-gemini').textContent = cfg.urls.gemini;
  $('#acc-gwkey').textContent = cfg.gatewayKey || '（未设置，留空也能用 — 仅本机访问）';
  $('#acc-adminkey').textContent = cfg.adminKey || '（未设置，留空也能用 — 仅本机访问）';
  $('#acc-console').textContent = cfg.urls.console + (cfg.adminKey ? '?key=' + cfg.adminKey : '');
  $('#acc-gw-req').textContent = cfg.gatewayKeyRequired ? '（客户端必须带此 key）' : '（可选）';
  const warns = [];
  if (!cfg.gatewayKey) warns.push('⚠ GATEWAY_KEY 未设置，任何人连得上 8787 都能用你的渠道。建议设一个。');
  if (!cfg.adminKey) warns.push('⚠ ADMIN_KEY 未设置，本机外任何人能改你的渠道配置。建议设一个。');
  $('#access-warning').innerHTML = warns.join('<br>');
  $('#access-hint').textContent = '在客户端（DSH / Cursor / Cline 等）填上面的 baseURL 和 Key 即可';
}

async function refresh() {
  try {
    const [data, cfg] = await Promise.all([api('/admin/api/status'), api('/admin/api/config').catch(() => null)]);
    $('#meta').textContent = `${data.channels.length} 个渠道 · ${new Date().toLocaleTimeString()}`;
    renderChannels(data);
    renderModels(data);
    if (cfg) renderAccess(cfg);
  } catch {}
}

$('#btn-refresh').onclick = refresh;

$('#btn-recheck').onclick = async () => {
  const btn = $('#btn-recheck');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ 探测中…';
  try {
    const r = await api('/admin/api/recheck', { method: 'POST' });
    const s = r.summary || { ok: 1, fail: 0, total: 1 };
    if (s.fail === 0) toast(`✓ 全部 ${s.total} 个渠道探测完成（${s.ok} 正常）`);
    else toast(`⚠ ${s.ok} 正常 / ${s.fail} 失败，共 ${s.total}。详情见控制台。`);
    // 显示详细日志（找或建一个日志区域；这里直接 alert 失败清单）
    const fails = (r.results || []).filter((x) => x.status === 'down');
    if (fails.length) {
      console.warn('[zzcsapi] recheck failures:', fails);
      // 在 meta 行下显示一个浮层
      showRecheckLog(r.results);
    }
    refresh();
  } catch (e) {
    toast('探测失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
};

function showRecheckLog(results) {
  let box = $('#recheck-log');
  if (!box) {
    box = document.createElement('div');
    box.id = 'recheck-log';
    box.className = 'recheck-log';
    $('#access-warning').parentNode.appendChild(box);
  }
  box.innerHTML = '<div style="color:#aab1c2;margin-bottom:4px">上次探测结果：</div>' +
    results.map((r) => {
      const cls = (r.status === 'ok' || r.status === 'degraded') ? 'ok' : 'fail';
      const tag = r.status === 'ok' ? '✓' : r.status === 'degraded' ? '~' : '✗';
      return `<div class="row"><span class="${cls}">${tag} ${escapeHtml(r.id)} <span class="small">→ ${r.status} · ${r.modelCount} 模型 · ${r.latencyMs < 0 ? '—' : r.latencyMs + 'ms'}</span></span><span class="small" style="color:#6e7691">${r.error ? escapeHtml(r.error.slice(0, 80)) : ''}</span></div>`;
    }).join('');
  setTimeout(() => { if (box) box.remove(); }, 15000);
}

$('#btn-add').onclick = () => openModal(null);

async function runTest({ model, channelId, prompt: promptText }) {
  let box = $('#test-log');
  if (!box) {
    box = document.createElement('div');
    box.id = 'test-log';
    box.className = 'recheck-log';
    box.innerHTML = '<div style="color:#aab1c2;margin-bottom:4px">模型测试结果：</div><div id="test-log-body"></div>';
    $('#access-warning').parentNode.appendChild(box);
  }
  const body = box.querySelector('#test-log-body');
  const body0 = `<div data-pending><div class="row"><span class="small">⏳ 正在测试 "${escapeHtml(model)}"${channelId ? '（仅渠道 ' + escapeHtml(channelId) + '）' : '（走完整调度）'}…</span></div></div>`;
  body.insertAdjacentHTML('afterbegin', body0);
  const t0 = Date.now();
  try {
    const r = await api('/admin/api/test', { method: 'POST', body: JSON.stringify({ model, channelId, prompt: promptText || 'Reply with one short sentence.' }) });
    const elapsed = Date.now() - t0;
    // 替换最早一条 pending
    const pending = box.querySelector('[data-pending]');
    if (pending) pending.remove();
    const lines = (r.results || []).map((res) => {
      const cls = res.ok ? 'ok' : 'fail';
      const tag = res.ok ? '✓' : '✗';
      let info = `${res.latencyMs}ms`;
      if (res.promptTokens || res.completionTokens) info += ` · ${res.promptTokens || 0}+${res.completionTokens || 0} tokens`;
      if (res.status) info += ` · HTTP ${res.status}`;
      const reply = res.reply ? ` <span class="small">"${escapeHtml(String(res.reply).slice(0, 80))}"</span>` : '';
      const err = res.error ? ` <span class="small" style="color:#e15759">${escapeHtml(String(res.error).slice(0, 120))}</span>` : '';
      return `<div class="row"><span class="${cls}">${tag} <b>${escapeHtml(res.channelId)}</b> · ${info}${reply}</span>${err ? '<span></span>' : ''}</div>${err ? `<div class="row" style="padding-left:14px"><span class="small" style="color:#e15759">${escapeHtml(String(res.error).slice(0, 200))}</span></div>` : ''}`;
    }).join('');
    body.insertAdjacentHTML('afterbegin', `<div data-pending><div class="row"><span class="small">${escapeHtml(model)}：用时 ${elapsed}ms</span></div>${lines}</div>`);
    const okCount = r.results.filter(x => x.ok).length;
    if (okCount === r.results.length) toast(`✓ ${model} 测试通过（${okCount}/${r.results.length}）`);
    else if (okCount === 0) toast(`✗ ${model} 全部失败`);
    else toast(`⚠ ${model} ${okCount}/${r.results.length} 通过`);
  } catch (e) {
    const pending = box.querySelector('[data-pending]');
    if (pending) pending.remove();
    body.insertAdjacentHTML('afterbegin', `<div class="row"><span class="fail">✗ ${escapeHtml(model)} 测试出错：${escapeHtml(e.message)}</span></div>`);
  }
}

$('#btn-test-model').onclick = () => openTestModal();

// 测试模型弹窗
function openTestModal(opts) {
  opts = opts || {};
  $('#test-mask').classList.add('show');
  const restrictedCh = opts.restrictChannelId ? state.channels.find(c => c.id === opts.restrictChannelId) : null;
  $('#test-modal-subtitle').textContent = restrictedCh ? '（仅渠道 ' + restrictedCh.id + '）' : '（走完整调度）';

  // 收集模型：仅显示各渠道 aliases 里的（即用户配置的可路由模型），按渠道分组
  const grouped = [];
  for (const ch of state.channels) {
    if (restrictedCh && ch.id !== restrictedCh.id) continue;
    if (!ch.enabled) continue;
    const items = [];
    for (const a of ch.aliases) {
      items.push({ model: a.alias, channelId: ch.id, label: a.alias + ' → ' + a.upstream, via: ch.name || ch.id });
    }
    if (items.length) grouped.push({ channel: ch, items });
  }

  let html = '';
  if (!grouped.length) html = '<div class="empty">暂无可测试模型（先添加渠道并配置 alias，或"获取模型"勾选模型保存）</div>';
  else {
    for (const g of grouped) {
      html += `<div style="padding:4px 6px;color:#aab1c2;font-size:12px;font-weight:600">${escapeHtml(g.channel.name || g.channel.id)} <span class="small">${g.items.length} 个</span></div>`;
      for (const it of g.items) {
        html += `<label style="display:flex;gap:6px;align-items:center;padding:4px 6px;font-size:12.5px;cursor:pointer;border-radius:4px"><input type="checkbox" data-test-model="${escapeHtml(it.model)}" data-test-channel="${escapeHtml(it.channelId)}" checked><span>${escapeHtml(it.label)}</span></label>`;
      }
    }
  }
  $('#test-model-list').innerHTML = html;
  $('#test-summary').textContent = grouped.reduce((s, g) => s + g.items.length, 0) + ' 个模型可选';

  // 全选切换
  const sa = $('#test-select-all');
  sa.checked = true;
  sa.onchange = () => {
    $$('#test-model-list input[type=checkbox]').forEach((c) => { c.checked = sa.checked; });
  };

  $('#test-cancel').onclick = () => $('#test-mask').classList.remove('show');
  $('#test-mask').onclick = (e) => { if (e.target.id === 'test-mask') $('#test-mask').classList.remove('show'); };
  $('#test-run').onclick = async () => {
    const picks = $$('#test-model-list input[type=checkbox]:checked').map((c) => ({ model: c.dataset.testModel, channelId: c.dataset.testChannel }));
    if (!picks.length) return err('至少勾选一个模型');
    const promptText = $('#test-prompt').value.trim() || 'hi';
    $('#test-mask').classList.remove('show');
    for (const p of picks) {
      await runTest({ model: p.model, channelId: restrictedCh ? restrictedCh.id : p.channelId, prompt: promptText });
    }
  };
}

// 复制按钮
document.addEventListener('click', async (e) => {
  const b = e.target.closest('.copy-btn');
  if (!b) return;
  const id = b.dataset.copy;
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.textContent.trim();
  try {
    await navigator.clipboard.writeText(text);
    const old = b.textContent;
    b.classList.add('ok'); b.textContent = '✓ 已复制';
    setTimeout(() => { b.classList.remove('ok'); b.textContent = old; }, 1200);
  } catch (err) {
    // 回退
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch { toast('复制失败'); }
    document.body.removeChild(ta);
  }
});

// 模态框
function openModal(ch) {
  $('#mask').classList.add('show');
  $('#modal-title').textContent = ch ? '编辑渠道：' + ch.id : '添加渠道';
  $('#f-id').value = ch ? ch.id : '';
  $('#f-id').disabled = !!ch;
  $('#f-name').value = ch ? ch.name : '';
  $('#f-protocol').value = ch ? ch.protocol : 'openai';
  $('#f-priority').value = ch ? ch.priority : 0;
  $('#f-enabled').value = ch ? String(ch.enabled !== false) : 'true';
  $('#f-baseUrl').value = ch ? ch.baseUrl : '';
  $('#f-apiKey').value = ch ? ch.apiKey : '';
  $('#f-autoAlias').checked = ch ? ch.autoAlias !== false : true;
  state.probedModels = [];
  state.modalChannel = ch;
  state.modalModels = ch && ch.models ? Object.entries(ch.models).map(([alias, upstream]) => ({ alias, upstream })) : [];
  renderModelsEditor();
  $('#probe-add-list').style.display = 'none';
  $('#probe-add-list').innerHTML = '';
  $('#probe-status').textContent = '';
  $('#btn-probe').disabled = false;
  $('#btn-probe').textContent = '🔍 探测获取';
}

$('#btn-cancel').onclick = () => $('#mask').classList.remove('show');
$('#mask').onclick = (e) => { if (e.target.id === 'mask') $('#mask').classList.remove('show'); };

// 行式编辑器
function renderModelsEditor() {
  const root = $('#models-editor');
  const rows = state.modalModels || [];
  if (!rows.length) {
    root.innerHTML = '<div class="model-empty">还没有模型。点「+ 添加一行」手动加，或「🔍 探测获取」从上游拉。</div>';
  } else {
    let html = '<div class="model-row head"><div>对外名称（alias）</div><div>上游真实模型</div><div></div><div></div></div>';
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      html += `<div class="model-row" data-i="${i}">
        <input type="text" data-k="alias" value="${escapeHtml(r.alias)}" placeholder="对外名称">
        <input type="text" data-k="upstream" value="${escapeHtml(r.upstream)}" placeholder="上游真实模型">
        <button class="test" data-act="test">测</button>
        <button class="del" data-act="del">✕</button>
      </div>`;
    }
    root.innerHTML = html;
  }
  $('#models-count').textContent = `— ${rows.length} 个`;

  // 绑定事件
  $$('#models-editor .model-row').forEach((row) => {
    if (row.classList.contains('head')) return;
    const i = Number(row.dataset.i);
    row.querySelectorAll('input').forEach((inp) => {
      inp.oninput = () => { state.modalModels[i][inp.dataset.k] = inp.value; };
    });
    const del = row.querySelector('[data-act=del]');
    if (del) del.onclick = () => { state.modalModels.splice(i, 1); renderModelsEditor(); };
    const test = row.querySelector('[data-act=test]');
    if (test) test.onclick = async () => {
      const ch = state.modalChannel;
      if (!ch) return err('请先保存渠道再测试单个模型');
      const m = state.modalModels[i];
      if (!m.upstream) return err('上游模型名为空');
      $('#mask').classList.remove('show');
      await runTest({ model: m.upstream, channelId: ch.id });
    };
  });
}

$('#btn-add-model').onclick = () => {
  state.modalModels.push({ alias: '', upstream: '' });
  renderModelsEditor();
  // 焦点到刚加的那行 alias 输入
  const rows = $$('#models-editor .model-row:not(.head)');
  if (rows.length) {
    const last = rows[rows.length - 1];
    const aliasIn = last.querySelector('input[data-k=alias]');
    if (aliasIn) aliasIn.focus();
  }
};

// 探测：把未在表里的新模型显示出来，让用户点击加进来（不覆盖现有）
$('#btn-probe').onclick = async () => {
  const baseUrl = $('#f-baseUrl').value.trim();
  const apiKey = $('#f-apiKey').value;
  const protocol = $('#f-protocol').value;
  if (!baseUrl) return err('先填 Base URL');
  if (!apiKey) return err('先填 API Key');
  const btn = $('#btn-probe');
  btn.disabled = true; btn.textContent = '⏳ 探测中…';
  $('#probe-status').textContent = '请求中…';
  try {
    const r = await api('/admin/api/probe', { method: 'POST', body: JSON.stringify({ baseUrl, apiKey, protocol }) });
    if (!r.ok) {
      $('#probe-status').textContent = '✗ 探测失败：' + (r.error || r.status || '未知');
      btn.disabled = false; btn.textContent = '🔍 重新探测';
      return;
    }
    const models = r.models || [];
    state.probedModels = models;
    $('#probe-status').textContent = `✓ ${models.length} 个模型，${r.latencyMs}ms`;
    btn.textContent = '🔍 重新探测';

    // 已有 alias/upstream 名集合（用于过滤已存在）
    const existing = new Set();
    for (const m of state.modalModels) {
      if (m.upstream) existing.add(m.upstream);
      if (m.alias) existing.add(m.alias);
    }
    const newOnes = models.filter((m) => !existing.has(m));
    const box = $('#probe-add-list');
    if (!newOnes.length) {
      box.innerHTML = '<span style="color:#6e7691">探测到的所有模型都已经在表里。</span>';
    } else {
      box.innerHTML = `<div style="color:#aab1c2;margin-bottom:4px">探测到 ${newOnes.length} 个新模型（点 + 加进表里）：</div>` +
        newOnes.map((m) => `<button type="button" class="copy-btn" data-add-model="${escapeHtml(m)}" style="margin:2px">+ ${escapeHtml(m)}</button>`).join('');
      box.querySelectorAll('[data-add-model]').forEach((b) => {
        b.onclick = () => {
          const mid = b.dataset.addModel;
          if (!state.modalModels.find((x) => x.upstream === mid || x.alias === mid)) {
            state.modalModels.push({ alias: mid, upstream: mid });
            renderModelsEditor();
            b.remove();
            toast('已添加 ' + mid);
          }
        };
      });
    }
    box.style.display = 'block';
  } catch (e) {
    $('#probe-status').textContent = '探测出错：' + e.message;
  } finally {
    btn.disabled = false;
  }
};

$('#btn-save').onclick = async () => {
  const id = $('#f-id').value.trim();
  if (!id) return err('ID 必填');
  const baseUrl = $('#f-baseUrl').value.trim();
  const apiKey = $('#f-apiKey').value;
  if (!baseUrl) return err('Base URL 必填');
  if (!apiKey) return err('API Key 必填');

  // 从行式编辑器收集
  const models = {};
  const seen = new Set();
  for (const r of state.modalModels) {
    const alias = (r.alias || '').trim();
    const upstream = (r.upstream || '').trim();
    if (!alias && !upstream) continue;     // 空行
    if (!upstream) return err('行：alias="' + alias + '" 缺上游模型名');
    const a = alias || upstream;
    if (seen.has(a)) return err('重复的 alias：' + a);
    seen.add(a);
    models[a] = upstream;
  }

  const body = {
    id,
    name: $('#f-name').value.trim() || id,
    protocol: $('#f-protocol').value,
    priority: Number($('#f-priority').value),
    enabled: $('#f-enabled').value === 'true',
    baseUrl,
    apiKey,
    autoAlias: $('#f-autoAlias').checked,
    models,
  };
  try {
    await api('/admin/api/channels', { method: 'POST', body: JSON.stringify(body) });
    toast('已保存到 config.json'); $('#mask').classList.remove('show'); refresh();
  } catch {}
};

// URL ?key=
const url = new URL(location.href);
if (url.searchParams.get('key')) {
  sessionStorage.setItem('adminKey', url.searchParams.get('key'));
  url.searchParams.delete('key');
  history.replaceState(null, '', url.toString());
}
refresh();
setInterval(refresh, 8000);
</script>
</body>

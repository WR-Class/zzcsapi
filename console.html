<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZZCSAPI 控制台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #0f1115; color: #d8dde6; }
  header { padding: 14px 22px; background: #181c25; border-bottom: 1px solid #2a2f3d; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .meta { color: #8a93a6; font-size: 12px; }
  .toolbar { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  button, select, input[type=text], input[type=number], input[type=password], textarea { background: #1f2430; color: #d8dde6; border: 1px solid #2c3140; border-radius: 6px; padding: 6px 12px; font: inherit; }
  textarea { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; padding: 8px 10px; resize: vertical; }
  button { cursor: pointer; }
  button:hover { background: #2a3140; }
  button.primary { background: #3a7afe; border-color: #3a7afe; color: white; }
  button.primary:hover { background: #4d88ff; }
  button.danger { background: #c13a3a; border-color: #c13a3a; color: white; }
  button.danger:hover { background: #d04a4a; }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  main { padding: 18px 22px; }
  h2 { font-size: 15px; margin: 22px 0 10px; color: #aab1c2; display: flex; align-items: center; gap: 10px; }
  h2 .hint { color: #6e7691; font-size: 11px; font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .card { background: #181c25; border: 1px solid #262b38; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .card h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12.5px; gap: 8px; }
  .card .row .k { color: #8a93a6; flex-shrink: 0; }
  .card .row .v { text-align: right; word-break: break-all; max-width: 70%; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; }
  .dot.ok { background: #3ddc97; }
  .dot.degraded { background: #f5b94a; }
  .dot.down { background: #e15759; }
  .dot.unknown { background: #6e7691; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; background: #2a3140; color: #cbd2e0; }
  .badge.openai { background: #103a23; color: #79e6b3; }
  .badge.anthropic { background: #4a2a18; color: #ffb68a; }
  .badge.gemini { background: #1a2c4a; color: #8ab4ff; }
  .alias-list { max-height: 110px; overflow: auto; background: #11141b; border-radius: 6px; padding: 6px 8px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.5px; }
  .alias-list .pair { display: flex; justify-content: space-between; gap: 8px; }
  .alias-list .pair .up { color: #6e7691; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .actions button { padding: 3px 8px; font-size: 12px; }
  .prio { display: flex; align-items: center; gap: 4px; }
  .prio input { width: 60px; padding: 3px 6px; }
  .err { color: #e15759; font-size: 11.5px; margin-top: 4px; }
  .empty { color: #6e7691; font-size: 12px; padding: 20px; text-align: center; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: #2a3140; color: #d8dde6; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 1000; max-width: 50vw; }
  .toast.show { opacity: 1; }
  .refresh-hint { color: #6e7691; font-size: 11px; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .mask.show { display: flex; }
  .modal { background: #181c25; border: 1px solid #2c3140; border-radius: 10px; padding: 18px 20px; width: 100%; max-width: 620px; max-height: 90vh; overflow: auto; box-shadow: 0 18px 50px rgba(0,0,0,0.4); }
  .modal h2 { margin: 0 0 12px; color: #d8dde6; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { color: #8a93a6; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .help { color: #6e7691; font-size: 11px; }
  .probe-box { background: #11141b; border: 1px solid #2c3140; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .probe-box .probe-row { display: flex; gap: 8px; align-items: center; }
  .probe-box .probe-row .grow { flex: 1; color: #8a93a6; font-size: 12px; }
  .model-list { max-height: 220px; overflow: auto; border: 1px solid #2c3140; border-radius: 6px; padding: 4px; background: #11141b; margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px; }
  .model-list label { display: flex; gap: 6px; align-items: center; padding: 4px 6px; font-size: 12px; cursor: pointer; border-radius: 4px; }
  .model-list label:hover { background: #1a1f29; }
  .model-list input { accent-color: #3a7afe; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: #3a7afe; }
  .small { font-size: 11px; color: #6e7691; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>ZZCSAPI 控制台</h1>
  <span class="meta" id="meta">—</span>
  <div class="toolbar">
    <button id="btn-refresh">刷新</button>
    <button id="btn-recheck" class="primary">立即探测全部</button>
    <button id="btn-add" class="primary">+ 添加渠道</button>
  </div>
</header>
<main>
  <h2>渠道 <span class="hint" id="refresh-hint"></span></h2>
  <div id="channels" class="grid"></div>
  <h2>聚合模型</h2>
  <div id="models"></div>
</main>
<div class="toast" id="toast"></div>

<div class="mask" id="mask">
  <div class="modal">
    <h2 id="modal-title">添加渠道</h2>

    <div class="field">
      <label>渠道 ID <span class="help">（英文/数字/下划线/短横线）</span></label>
      <input id="f-id" type="text" placeholder="vendor-x">
    </div>
    <div class="field">
      <label>显示名称</label>
      <input id="f-name" type="text" placeholder="中转 X">
    </div>
    <div class="field-row">
      <div class="field">
        <label>协议</label>
        <select id="f-protocol">
          <option value="openai">openai</option>
          <option value="anthropic">anthropic</option>
          <option value="gemini">gemini</option>
        </select>
      </div>
      <div class="field">
        <label>优先级</label>
        <input id="f-priority" type="number" value="0">
      </div>
      <div class="field" style="flex:0 0 100px">
        <label>启用</label>
        <select id="f-enabled">
          <option value="true">是</option>
          <option value="false">否</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Base URL <span class="help">（不含尾斜杠。openai 通常 https://host/v1，anthropic https://host，gemini https://generativelanguage.googleapis.com）</span></label>
      <input id="f-baseUrl" type="text" placeholder="https://api.example.com/v1">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="f-apiKey" type="password" placeholder="sk-...">
    </div>

    <!-- 模型选择区 -->
    <div class="probe-box">
      <div class="probe-row">
        <button id="btn-probe" type="button">🔍 获取模型</button>
        <span class="grow" id="probe-status">点击按钮探测渠道模型列表</span>
        <label class="toggle"><input type="checkbox" id="f-autoAlias"> 自动路由探测到的所有模型（不勾则只暴露下方"获取模型"里勾选的）</label>
      </div>
      <div class="model-list hidden" id="model-list"></div>
      <div class="small" id="model-summary"></div>
    </div>

    <!-- 自定义 alias（可选） -->
    <div class="field">
      <label class="toggle"><input type="checkbox" id="f-useCustom"> 自定义 alias（高级）</label>
      <textarea id="f-models" rows="5" class="hidden" placeholder='{"my-coding": "gpt-4o"}'></textarea>
      <span class="small">默认不需要：点「获取模型」勾选要用的即可。打开此项可手动给同一个上游起多个 alias，或改名字。</span>
    </div>

    <div class="modal-actions">
      <button id="btn-cancel" class="ghost">取消</button>
      <button id="btn-save" class="primary">保存</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
function err(msg) { toast('⚠️ ' + msg); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const k = sessionStorage.getItem('adminKey');
  if (k) headers['Authorization'] = 'Bearer ' + k;
  const r = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  if (r.status === 401) { err('未授权'); throw new Error('401'); }
  const j = await r.json().catch(() => null);
  if (!r.ok) { err(j && (j.error || j.message) || ('HTTP ' + r.status)); throw new Error('http ' + r.status); }
  return j;
}

const state = { channels: [], probedModels: [] };

function statusBadge(s) {
  const map = { ok: '正常', degraded: '降级', down: '不可用', unknown: '未知' };
  return `<span class="dot ${s}"></span><span>${map[s] || s}</span>`;
}
function protocolBadge(p) { return `<span class="badge ${p}">${p}</span>`; }

function renderChannels(data) {
  state.channels = data.channels;
  const root = $('#channels');
  if (!data.channels.length) { root.innerHTML = '<div class="empty" style="grid-column:1/-1">尚未配置渠道。点右上角"+ 添加渠道"开始。</div>'; return; }
  root.innerHTML = data.channels.map((ch) => {
    const aliases = ch.aliases.map(a => `<div class="pair"><span>${escapeHtml(a.alias)}</span><span class="up">→ ${escapeHtml(a.upstream)}</span></div>`).join('') || '<div class="empty">无别名</div>';
    const err1 = ch.lastError ? `<div class="err">${escapeHtml(ch.lastError)}</div>` : '';
    const checked = ch.lastCheck ? new Date(ch.lastCheck).toLocaleTimeString() : '—';
    return `
      <div class="card" data-id="${escapeHtml(ch.id)}">
        <h3>${protocolBadge(ch.protocol)} ${escapeHtml(ch.name)} <span class="badge">${escapeHtml(ch.id)}</span></h3>
        <div class="row"><span class="k">状态</span><span class="v">${statusBadge(ch.status)}</span></div>
        <div class="row"><span class="k">端点</span><span class="v">${escapeHtml(ch.baseUrl)}</span></div>
        <div class="row"><span class="k">延迟</span><span class="v">${ch.latencyMs < 0 ? '—' : ch.latencyMs + ' ms'}</span></div>
        <div class="row"><span class="k">探测时间</span><span class="v">${checked}</span></div>
        <div class="row"><span class="k">上游模型</span><span class="v">${ch.upstreamModels.length}</span></div>
        <div class="row"><span class="k">别名</span><span class="v">${ch.aliases.length}</span></div>
        <div class="alias-list">${aliases}</div>
        ${err1}
        <div class="actions">
          <div class="prio">
            <span class="k">优先级</span>
            <input type="text" value="${ch.priority}" data-edit="priority">
          </div>
          <button data-act="save-prio">保存</button>
          <button data-act="probe">探测</button>
          <button data-act="edit">编辑</button>
          <button data-act="toggle" class="${ch.enabled ? '' : 'primary'}">${ch.enabled ? '停用' : '启用'}</button>
          <button data-act="delete" class="danger">删除</button>
        </div>
      </div>
    `;
  }).join('');

  $$('.card').forEach((card) => {
    const id = card.dataset.id;
    card.querySelector('[data-act=save-prio]').onclick = async () => {
      const priority = Number(card.querySelector('[data-edit=priority]').value);
      if (Number.isNaN(priority)) return err('优先级必须为数字');
      await api('/admin/api/channel', { method: 'POST', body: JSON.stringify({ id, priority }) });
      toast('已保存优先级'); refresh();
    };
    card.querySelector('[data-act=probe]').onclick = async () => {
      await api('/admin/api/recheck', { method: 'POST', body: JSON.stringify({ id }) });
      toast('已探测'); refresh();
    };
    card.querySelector('[data-act=edit]').onclick = () => openModal(state.channels.find(c => c.id === id));
    card.querySelector('[data-act=toggle]').onclick = async () => {
      const cur = state.channels.find(c => c.id === id);
      await api('/admin/api/channel', { method: 'POST', body: JSON.stringify({ id, enabled: !cur.enabled }) });
      toast(cur.enabled ? '已停用' : '已启用'); refresh();
    };
    card.querySelector('[data-act=delete]').onclick = async () => {
      if (!confirm('确定要删除渠道 “' + id + '” 吗？')) return;
      await api('/admin/api/channels', { method: 'DELETE', body: JSON.stringify({ id }) });
      toast('已删除'); refresh();
    };
  });
}

function renderModels(data) {
  const root = $('#models');
  const sections = [];
  for (const [proto, list] of Object.entries(data.aggregated)) {
    if (!list.length) continue;
    sections.push(`
      <div class="card" style="margin-bottom:12px">
        <h3>${protocolBadge(proto)} <span>${list.length} 个模型</span></h3>
        <div class="alias-list" style="max-height:none">${list.map(m => `<div class="pair"><span>${escapeHtml(m)}</span></div>`).join('')}</div>
      </div>
    `);
  }
  root.innerHTML = sections.join('') || '<div class="empty">无模型</div>';
}

async function refresh() {
  try {
    const data = await api('/admin/api/status');
    $('#meta').textContent = `${data.channels.length} 个渠道 · ${new Date().toLocaleTimeString()}`;
    renderChannels(data);
    renderModels(data);
  } catch {}
}

$('#btn-refresh').onclick = refresh;
$('#btn-recheck').onclick = async () => { await api('/admin/api/recheck', { method: 'POST' }); toast('已发起全量探测'); refresh(); };
$('#btn-add').onclick = () => openModal(null);

// 模态框
function openModal(ch) {
  $('#mask').classList.add('show');
  $('#modal-title').textContent = ch ? '编辑渠道：' + ch.id : '添加渠道';
  $('#f-id').value = ch ? ch.id : '';
  $('#f-id').disabled = !!ch;
  $('#f-name').value = ch ? ch.name : '';
  $('#f-protocol').value = ch ? ch.protocol : 'openai';
  $('#f-priority').value = ch ? ch.priority : 0;
  $('#f-enabled').value = ch ? String(ch.enabled !== false) : 'true';
  $('#f-baseUrl').value = ch ? ch.baseUrl : '';
  $('#f-apiKey').value = ch ? ch.apiKey : '';
  $('#f-autoAlias').checked = ch ? ch.autoAlias !== false : true;
  state.probedModels = [];

  // 自定义 alias 区
  const hasCustom = ch && ch.models && Object.keys(ch.models).length > 0;
  $('#f-useCustom').checked = !!hasCustom;
  $('#f-models').classList.toggle('hidden', !hasCustom);
  $('#f-models').value = hasCustom ? JSON.stringify(ch.models, null, 2) : '';

  // 探测区
  $('#model-list').classList.add('hidden');
  $('#model-list').innerHTML = '';
  $('#model-summary').textContent = '';
  $('#probe-status').textContent = '点击按钮探测渠道模型列表';
  $('#btn-probe').disabled = false;
  $('#btn-probe').textContent = '🔍 获取模型';
}

$('#btn-cancel').onclick = () => $('#mask').classList.remove('show');
$('#mask').onclick = (e) => { if (e.target.id === 'mask') $('#mask').classList.remove('show'); };

$('#f-useCustom').onchange = (e) => {
  $('#f-models').classList.toggle('hidden', !e.target.checked);
  if (e.target.checked && !$('#f-models').value) $('#f-models').value = '{\n  "my-alias": "upstream-model-name"\n}';
};

// 探测模型
$('#btn-probe').onclick = async () => {
  const baseUrl = $('#f-baseUrl').value.trim();
  const apiKey = $('#f-apiKey').value;
  const protocol = $('#f-protocol').value;
  if (!baseUrl) return err('先填 Base URL');
  if (!apiKey) return err('先填 API Key');
  const btn = $('#btn-probe');
  btn.disabled = true; btn.textContent = '⏳ 探测中…';
  $('#probe-status').textContent = '请求中…';
  try {
    const r = await api('/admin/api/probe', { method: 'POST', body: JSON.stringify({ baseUrl, apiKey, protocol }) });
    if (!r.ok) {
      $('#probe-status').textContent = '探测失败：' + (r.error || r.status || '未知');
      btn.disabled = false; btn.textContent = '🔍 重新探测';
      return;
    }
    const models = r.models || [];
    state.probedModels = models;
    const list = $('#model-list');
    list.innerHTML = models.length
      ? models.map((m) => `<label><input type="checkbox" data-mid="${escapeHtml(m)}" checked><span>${escapeHtml(m)}</span></label>`).join('')
      : '<div class="empty" style="grid-column:1/-1">返回了空模型列表</div>';
    list.classList.remove('hidden');
    $('#probe-status').textContent = `✓ 探测成功，${models.length} 个模型，${r.latencyMs}ms`;
    $('#model-summary').textContent = '勾选要路由的模型，未勾选的不会出现在 DSH 列表中（默认全选）。';
    btn.textContent = '🔍 重新探测';
  } catch (e) {
    $('#probe-status').textContent = '探测出错：' + e.message;
  } finally {
    btn.disabled = false;
  }
};

$('#btn-save').onclick = async () => {
  const id = $('#f-id').value.trim();
  if (!id) return err('ID 必填');
  const baseUrl = $('#f-baseUrl').value.trim();
  const apiKey = $('#f-apiKey').value;
  if (!baseUrl) return err('Base URL 必填');
  if (!apiKey) return err('API Key 必填');

  // 收集模型映射：
  // 1) 勾选了"自定义 alias"：用 f-models 的 JSON
  // 2) 否则：把探测到的被勾选的模型全部作为 alias → 上游同名的映射（即便用户没显式存，
  //    后端也会把 ch.models 里的真模型当作可路由的——这里存的话更直观）
  let models = {};
  if ($('#f-useCustom').checked) {
    const t = $('#f-models').value.trim();
    if (t) {
      try { models = JSON.parse(t); }
      catch (e) { return err('自定义 alias JSON 解析失败：' + e.message); }
    }
  } else {
    const checked = $$('#model-list input[type=checkbox]:checked').map((c) => c.dataset.mid);
    for (const m of checked) models[m] = m;
  }

  const body = {
    id,
    name: $('#f-name').value.trim() || id,
    protocol: $('#f-protocol').value,
    priority: Number($('#f-priority').value),
    enabled: $('#f-enabled').value === 'true',
    baseUrl,
    apiKey,
    autoAlias: $('#f-autoAlias').checked,
    models,
  };
  try {
    await api('/admin/api/channels', { method: 'POST', body: JSON.stringify(body) });
    toast('已保存到 config.json'); $('#mask').classList.remove('show'); refresh();
  } catch {}
};

// URL ?key=
const url = new URL(location.href);
if (url.searchParams.get('key')) {
  sessionStorage.setItem('adminKey', url.searchParams.get('key'));
  url.searchParams.delete('key');
  history.replaceState(null, '', url.toString());
}
refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>

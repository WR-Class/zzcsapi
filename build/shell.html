<!-- 背景层：暖色氛围（网格 + 光晕 + 噪点），固定不参与滚动 -->
<div class="bg-layer bg-grid"></div>
<div class="bg-layer bg-glow"></div>
<div class="bg-layer bg-noise"></div>

<div class="app">
  <!-- ══ 侧栏 ══ -->
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8z"></path></svg>
      </div>
      <div>
        <div class="brand-name">ZZCSAPI</div>
        <div class="brand-sub">Gateway Console</div>
      </div>
    </div>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot">
      <button class="icon-btn" id="themeBtn" title="切换到深色"></button>
      <span class="mono muted" style="font-size:10.5px" id="gwHost">127.0.0.1:8787</span>
      <span class="ver" id="clock">--:--:--</span>
    </div>
  </aside>

  <!-- ══ 主区 ══ -->
  <div class="main">
    <header class="topbar">
      <div class="crumb"><span>ZZCSAPI</span><span class="sep">/</span><span class="cur" id="crumbCur">总览</span></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--tx-3)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
        <input id="globalSearch" placeholder="搜索渠道…">
        <span class="kbd">⌘K</span>
      </div>
      <button class="icon-btn" id="btnRecheck" title="立即探测全部渠道">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>
      </button>
    </header>
    <!-- .viewport 是整页唯一滚动容器，页面内容全部渲染进这里 -->
    <div class="viewport" id="viewport"></div>
  </div>
</div>

<!-- 抽屉遮罩：点击关闭抽屉（弹窗遮罩是 #mask，那个刻意不响应点击，见下方注释） -->
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>

<!-- 遮罩不响应点击关闭：拖选复制时鼠标容易滑出弹窗，误触会打断操作。关闭请用右上角 ×、取消按钮或 Esc -->
<div class="mask" id="mask">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toasts" id="toasts"></div>

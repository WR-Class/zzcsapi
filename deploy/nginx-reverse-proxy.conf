# zzcsapi 反代采信层（宿主机 nginx → 网关容器）
# ─────────────────────────────────────────────────────────────────────────────
# 为什么必须有这一层（v1.18.14）：Docker Desktop 的端口发布是 NAT——打进 8787 的
# 所有连接（宿主机自己 + 局域网其他机器）进容器后源地址都变成网桥网关那一个 IP，
# 来源统计永远只有一行。宿主机上的 nginx 是连接的真正终点，能看到真实客户端 IP，
# 把它写进 X-Forwarded-For 转给网关；网关看到"连接来自受信的反代地址"（config.security
# .trustedProxy，= docker-compose.yml 固定子网的网桥网关 172.28.137.1）才采信 XFF。
#
# 用法（nginx for Windows 便携版，解压到 D:\DSHXM\nginx-rt）：
#   启动：D:\DSHXM\nginx-rt\nginx.exe -p D:\DSHXM\nginx-rt -c D:\DSHXM\ZZCSAPI\deploy\nginx-reverse-proxy.conf
#   重载：…nginx.exe -p … -c … -s reload      （改了本文件后）
#   停止：…nginx.exe -p … -c … -s stop
#   （nginx 不是 Windows 服务——重启电脑后要再跑一次。开机自启直接登记本仓库的幂等脚本：
#     deploy/start-reverse-proxy.ps1，命令见其头部注释；撤销 = 删掉那条启动项）
# 前提：网关容器只绑宿主回环转发口（.env 写 ZZCSAPI_PUBLISH=127.0.0.1:18787:8787），
#       config.json 的 security.trustedProxy 填本项目固定子网的网桥网关 172.28.137.1。
#
# 三条安全纪律（改坏任何一条都是真漏洞）：
#   1. X-Forwarded-For 一律**覆写**为 $remote_addr —— 网关采信 XFF 第一跳；
#      换成 $proxy_add_x_forwarded_for（追加模式）会让局域网客户端预置假 XFF，
#      把伪造 IP 写进来源统计、甚至借封禁功能把别人锁死。
#   2. proxy_pass 只指 127.0.0.1:18787 —— 这是网关容器只绑宿主机回环的转发口；
#      局域网绕不过本层直连网关（18787 不对外），每台机器才会各占一行统计。
#   3. proxy_buffering 必须关 —— SSE 流式（chat/completions）被 nginx 缓冲会卡死。
# ─────────────────────────────────────────────────────────────────────────────

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log off;                     # per-IP 可见性归网关统计页管，nginx 不留访问日志
    client_max_body_size 100m;           # 图片/长上下文 base64；网关自身不设限，这里是唯一上限
    proxy_buffering off;                # SSE 不缓冲
    proxy_http_version 1.1;
    proxy_set_header Connection "";     # 上游长连接
    proxy_set_header Host $http_host;   # 原样透传客户端 Host（网关的 Host 门要看原始值）
    proxy_set_header X-Forwarded-For $remote_addr;   # 覆写：受信反代交给网关的唯一真实来源
    proxy_read_timeout 3600s;            # 慢流式（长回复）不被掐
    proxy_send_timeout 60s;

    server {
        listen 8787;                     # 局域网入口（0.0.0.0）
        location / {
            proxy_pass http://127.0.0.1:18787;
        }
    }
}

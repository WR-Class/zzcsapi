# zzcsapi 公网前端（TLS + 反代采信）——跑在公网服务器宿主机上的 nginx
# ─────────────────────────────────────────────────────────────────────────────
# 与 deploy/nginx-reverse-proxy.conf（本机反代采信层）同一条流水线，公网版多了三件事：
#   ① TLS：Let's Encrypt 证书（webroot 签发，certbot.timer 自动续期）+ 80 段只留
#      ACME 验证与 301 跳转，业务全走 443；
#   ② HSTS / COOP / CORP 三头（外部复测 N-03：TLS 里程碑时落地——只在公网 TLS 层加，
#      本机 http 前端不加，http 上 HSTS 无效）；
#   ③ 域名必须登记进网关 .env 的 ZZCSAPI_ALLOWED_HOSTS——网关的 Host 门默认拒陌生
#      域名（421），不登记公网自己都进不来。
#
# 用法（服务器上，域名以 wurong.us.ci 为例）：
#   1) 签证书前本文件起不来（443 段引用的证书还不存在，nginx -t 过不了）——先用
#      80-only 引导配置把 ACME 跑通（见 README「方式四」第 5 步）：
#        certbot certonly --webroot -w /var/www/certbot -d <域名> --register-unsafely-without-email
#   2) 证书到手后：cp deploy/nginx-public.conf /etc/nginx/nginx.conf && nginx -t
#      && systemctl reload nginx && systemctl enable nginx
#   3) 续期：certbot.timer 自动跑（webroot 参数存在 /etc/letsencrypt/renewal/ 里）。
#
# 六条纪律（前四条与本机 nginx-reverse-proxy.conf 同源）：
#   1. X-Forwarded-For 一律**覆写**为 $remote_addr——追加模式（$proxy_add_x_forwarded_for）
#      会让公网客户端预置假 XFF 伪造来源统计、甚至借封禁功能把人锁死；
#   2. proxy_pass 只指 127.0.0.1:18787——网关容器只绑宿主机回环转发口（.env 的
#      ZZCSAPI_PUBLISH=127.0.0.1:18787:8787），公网从 8787/18787 都摸不到网关，
#      ufw 默认全拒是第二道闸；
#   3. proxy_buffering 必须关——SSE 流式（chat/completions）被 nginx 缓冲会卡死；
#   4. server_tokens 必须关——Server 头只报 "nginx" 不报版本号（外部复测 N-01）；
#   5. 改响应头要两层一起看——三头加在公网 TLS 这层，网关自己也下发一组安全头，
#      别在网关里再加一遍（改了 nginx 被网关盖住、或反之，都是坑）；
#   6. 80 段不得长出业务 location——证书没续上的窗口期 80 还活着，别让明文业务复活。
# ─────────────────────────────────────────────────────────────────────────────

worker_processes  auto;
error_log  /var/log/nginx/zzcsapi-error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log off;                     # per-IP 可见性归网关统计页管，nginx 不留访问日志
    server_tokens off;                  # Server 头不报版本号（外部复测 N-01）

    client_max_body_size 100m;          # 图片/长上下文 base64；网关自身不设限，这里是唯一上限
    proxy_buffering off;                # SSE 不缓冲
    proxy_http_version 1.1;
    proxy_set_header Connection "";     # 上游长连接
    proxy_set_header Host $http_host;   # 原样透传客户端 Host（网关的 Host 门要看原始值）
    proxy_set_header X-Forwarded-For $remote_addr;   # 覆写：受信反代交给网关的唯一真实来源
    proxy_read_timeout 3600s;            # 慢流式（长回复）不被掐
    proxy_send_timeout 60s;

    # TLS 基线：只开 1.2/1.3；会话缓存半小时、不发会话票据（前向保密优先）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:zzssl:10m;
    ssl_session_timeout 30m;
    ssl_session_tickets off;

    # ACME webroot（certbot --webroot -w /var/www/certbot 把挑战文件写到这里）
    # mkdir -p /var/www/certbot

    server {
        listen 80;
        server_name wurong.us.ci;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name wurong.us.ci;

        ssl_certificate     /etc/letsencrypt/live/wurong.us.ci/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wurong.us.ci/privkey.pem;

        # TLS 里程碑三头（外部复测 N-03 的既定姿势：只在公网 TLS 层加，本机 http 层不加）
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        location / {
            proxy_pass http://127.0.0.1:18787;
        }
    }
}

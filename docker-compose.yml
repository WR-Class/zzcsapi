services:
  zzcsapi:
    build: .
    image: zzcsapi:local
    container_name: zzcsapi
    restart: unless-stopped
    ports:
      # 默认 = 直连模式：局域网可访问，但来源统计里所有机器会折叠成一行网桥 IP（Docker NAT 所致）。
      # 想让来源统计看到每台机器的真实 IP（反代采信模式，见 README「方式三」）：在根目录 .env 里写
      #   ZZCSAPI_PUBLISH=127.0.0.1:18787:8787
      # 再在宿主机跑 nginx（deploy/nginx-reverse-proxy.conf，监听 8787 → 转发到这里）+
      # config.json 的 security.trustedProxy 填本项目固定子网的网桥网关 172.28.137.1。
      # 想只本机自用不开放局域网：改成 "127.0.0.1:8787:8787"。
      - "${ZZCSAPI_PUBLISH:-8787:8787}"
    environment:
      TZ: Asia/Shanghai
      PORT: "8787"
      ZZCSAPI_BIND: "0.0.0.0"
      # PT01 修复：默认关闭免鉴权（原默认 1 = 所有人可读渠道明文 key/烧额度）
      ZZCSAPI_NOAUTH: ${ZZCSAPI_NOAUTH:-0}
      # 分发/分享场景默认留空 → 服务端首启自动生成随机密钥并打印到 docker logs、写入 config.json；
      # 想固定自己的密钥：仓库根建 .env 写 ZZCSAPI_ADMIN_KEY=... / ZZCSAPI_GATEWAY_KEY=...（.env 不入仓库）
      ADMIN_KEY: ${ZZCSAPI_ADMIN_KEY:-}
      GATEWAY_KEY: ${ZZCSAPI_GATEWAY_KEY:-}
      # Host 门白名单（v1.18.10 渗透整改 V-07）：默认放行 localhost 与回环/私网 IP 字面量（按裸 IP 访问即常态）；
      # 反代域名 / 公网域名必须在此登记（逗号分隔），否则 421。公网部署（README「方式四」）在根目录 .env 写
      #   ZZCSAPI_ALLOWED_HOSTS=你的域名
      # v1.18.16 教训：这里必须真透传——此前是注释行，公网域名进容器一律 421。
      ZZCSAPI_ALLOWED_HOSTS: ${ZZCSAPI_ALLOWED_HOSTS:-}
      ZZCSAPI_CONFIG: /app/config.json
      # 请求体落盘诊断（v1.18.27，默认关闭）：根目录 .env 写 ZZCSAPI_DUMP_BODIES=/app/dump 即开启，
      # 把客户端会话类请求体原样落到 ./dump/（只留最近 ZZCSAPI_DUMP_MAX 个，默认 30）。
      # 用途：抓"上游 200 + finish=length + 输出仅 1 token / 200 + 空流"那类失败的真实请求形态。
      # ⚠ dump 文件含完整对话内容，只在排查时开；公网部署别开（README「方式四」已在 .env 模板标注）。
      ZZCSAPI_DUMP_BODIES: ${ZZCSAPI_DUMP_BODIES:-}
      ZZCSAPI_DUMP_MAX: ${ZZCSAPI_DUMP_MAX:-30}
    volumes:
      - ./config.json:/app/config.json
      - ./usage.json:/app/usage.json
      # 诊断落盘目录（未开启诊断时该挂载点为空目录，零副作用）
      - ./dump:/app/dump
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - zznet

# 固定子网 → 网桥网关 IP 恒为 172.28.137.1（反代采信模式下 config.security.trustedProxy 登记的就是它：
# 网关眼里"宿主机 nginx 经 Docker 转发直连进来"的源地址）。不固定子网的话 Docker 每次建网分到的
# 网段不同，trustedProxy 会静默失效（采信不到 X-Forwarded-For，来源统计又退回一行网桥 IP）。
networks:
  zznet:
    driver: bridge
    ipam:
      config:
        - subnet: ${ZZCSAPI_SUBNET:-172.28.137.0/24}

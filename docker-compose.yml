services:
  zzcsapi:
    build: .
    image: zzcsapi:local
    container_name: zzcsapi
    restart: unless-stopped
    ports:
      # 默认 = 直连模式：局域网可访问，但来源统计里所有机器会折叠成一行网桥 IP（Docker NAT 所致）。
      # 想让来源统计看到每台机器的真实 IP（反代采信模式，见 README「方式三」）：在根目录 .env 里写
      #   ZZCSAPI_PUBLISH=127.0.0.1:18787:8787
      # 再在宿主机跑 nginx（deploy/nginx-reverse-proxy.conf，监听 8787 → 转发到这里）+
      # config.json 的 security.trustedProxy 填本项目固定子网的网桥网关 172.28.137.1。
      # 想只本机自用不开放局域网：改成 "127.0.0.1:8787:8787"。
      - "${ZZCSAPI_PUBLISH:-8787:8787}"
    environment:
      TZ: Asia/Shanghai
      PORT: "8787"
      ZZCSAPI_BIND: "0.0.0.0"
      # PT01 修复：默认关闭免鉴权（原默认 1 = 所有人可读渠道明文 key/烧额度）
      ZZCSAPI_NOAUTH: ${ZZCSAPI_NOAUTH:-0}
      # 分发/分享场景默认留空 → 服务端首启自动生成随机密钥并打印到 docker logs、写入 config.json；
      # 想固定自己的密钥：仓库根建 .env 写 ZZCSAPI_ADMIN_KEY=... / ZZCSAPI_GATEWAY_KEY=...（.env 不入仓库）
      ADMIN_KEY: ${ZZCSAPI_ADMIN_KEY:-}
      GATEWAY_KEY: ${ZZCSAPI_GATEWAY_KEY:-}
      # Host 门白名单（v1.18.10 渗透整改 V-07）：默认放行 localhost 与回环/私网 IP 字面量（按裸 IP 访问即常态）；
      # 反代域名 / 公网域名必须在此登记（逗号分隔），否则 421。公网部署（README「方式四」）在根目录 .env 写
      #   ZZCSAPI_ALLOWED_HOSTS=你的域名
      # v1.18.16 教训：这里必须真透传——此前是注释行，公网域名进容器一律 421。
      ZZCSAPI_ALLOWED_HOSTS: ${ZZCSAPI_ALLOWED_HOSTS:-}
      # v1.18.86：配置/用量/代际快照统一放进**一个目录**挂载（原来是三个单文件/目录挂载混着）。
      # 为什么必须挂目录：单文件挂载时容器里那个路径是**挂载点本身**，它与 /app 是**不同 device**，
      #   `writeFileAtomic` 的 `rename(tmp, target)` 必然失败（本机实测报 EXDEV；挂载点在别的系统上会是 EBUSY），
      #   只能降级成原地覆写 —— 即"进程恰好在这几 KB 写入时被杀 → 留下半截 JSON"那个窗口又回来了。
      #   挂目录后 config.json / usage.json / config-history 三者与 tmp **同 device**，rename 成功，原子性完整。
      # 本机实测（v1.18.85 那版单文件挂载）：/app 是 dev=91，/app/config.json 与 /app/usage.json 是 dev=72 ⇒ 跨设备。
      # 迁移：把根目录的 config.json / usage.json / config-history/ 挪进 ./data/（首启为空也可，
      #   loadConfig 会自动从镜像里的 config.example.json 生成一份并提示填渠道）。
      ZZCSAPI_CONFIG: /app/data/config.json
      # 用法统计与代际快照都从 CONFIG_PATH 的 dirname 推导（见 server.js 的 USAGE_PATH / CONFIG_HISTORY_DIR），
      # 所以挂一个目录就够了，不用逐个配 env。
      ZZCSAPI_USAGE: /app/data/usage.json
      ZZCSAPI_CONFIG_HISTORY_DIR: /app/data/config-history
      # 请求体落盘诊断（v1.18.27，默认关闭）：根目录 .env 写 ZZCSAPI_DUMP_BODIES=/app/dump 即开启，
      # 把客户端会话类请求体原样落到 ./dump/（只留最近 ZZCSAPI_DUMP_MAX 个，默认 30）。
      # 用途：抓"上游 200 + finish=length + 输出仅 1 token / 200 + 空流"那类失败的真实请求形态。
      # ⚠ dump 文件含完整对话内容，只在排查时开；公网部署别开（README「方式四」已在 .env 模板标注）。
      ZZCSAPI_DUMP_BODIES: ${ZZCSAPI_DUMP_BODIES:-}
      ZZCSAPI_DUMP_MAX: ${ZZCSAPI_DUMP_MAX:-30}
      # 上下文节食（v1.18.61，默认关闭）：根目录 .env 写 ZZCSAPI_CONTEXT_DIET=1 即开启 ——
      # 摘掉几十轮前的旧截图，换成占位符。实测动机：一份 4.52MB 的真实请求里 8 张图占 3.96MB（85%），
      # 其中 7 张距今 88~189 条消息 —— 早已分析完，结论在后面的 assistant 消息里，字节却每轮重发。
      # 两条**同时**满足才保留：最近 KEEP_MSGS 条消息内、且最近 KEEP_IMAGES 张之内。
      # ⚠ 显式写 0 是有意义的（= 全部摘掉），代码里刻意把「未设/空串」与「显式 0」分开处理。
      ZZCSAPI_CONTEXT_DIET: ${ZZCSAPI_CONTEXT_DIET:-}
      ZZCSAPI_DIET_KEEP_MSGS: ${ZZCSAPI_DIET_KEEP_MSGS:-}
      ZZCSAPI_DIET_KEEP_IMAGES: ${ZZCSAPI_DIET_KEEP_IMAGES:-}
      # 首字死线随请求体积缩放（v1.18.61 默认开；v1.18.62 上限 120s → **90s**，用户选定）。
      # 上限必须**小于客户端单次超时**，否则那一家永远得不到一次完整的尝试。
      ZZCSAPI_FIRST_BYTE_SCALING: ${ZZCSAPI_FIRST_BYTE_SCALING:-}
      ZZCSAPI_FIRST_BYTE_PER_KB: ${ZZCSAPI_FIRST_BYTE_PER_KB:-}
      ZZCSAPI_FIRST_BYTE_MAX_MS: ${ZZCSAPI_FIRST_BYTE_MAX_MS:-}
      # 候选游标（v1.18.62）：同一会话 + **逐字节相同**的报文（= 客户端自动重试）从上次停下的
      # 下一家继续；报文一变（用户新一轮）就归零。留空 = 默认 15 分钟。
      ZZCSAPI_CHAIN_CURSOR_TTL_MS: ${ZZCSAPI_CHAIN_CURSOR_TTL_MS:-}
    volumes:
      # ★ 配置/用量/代际快照：**一个目录装全部**（v1.18.86 起，取代原来的
      #   `./config.json:/app/config.json` + `./usage.json:/app/usage.json` + `./config-history:/app/config-history`
      #   三行）。理由见 environment 里 ZZCSAPI_CONFIG 上面那段：单文件挂载是挂载点、跨 device，rename 必然失败。
      # ⚠️ 这个目录里全是**整份配置原文 + 用量记录**，含全部渠道明文 apiKey，已 gitignore。
      - ./data:/app/data
      # 诊断落盘目录（未开启诊断时该挂载点为空目录，零副作用）
      - ./dump:/app/dump
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    # ── 容器加固（v1.18.87）：只读根文件系统 + 丢弃全部 capability ──────────────
    # 为什么现在才敢开：只读根fs 的前提是"运行时需要写的东西都在挂载卷里"。
    #   v1.18.86 把 config.json / usage.json / config-history 统一收进 ./data 之后，
    #   网关的**全部**写盘目标（见 server.js 的 CONFIG_PATH / USAGE_PATH /
    #   CONFIG_HISTORY_DIR / DUMP_DIR）都落在两个挂载点上，根fs 一次都不用写。
    #   在此之前（单文件挂载时代）`config.json.bak`、`usage.json` 的 tmp 与代际快照
    #   分散在三处，只要有一处没挂就必然 EROFS，所以那时开不了。
    # 效果：即使网关被拿下（RCE），攻击者也**没法在镜像里落东西**——
    #   没有可写的 /app、没有可写的 /usr，改不了 console.html、塞不进后门脚本。
    #   唯一可写处是两个绑定目录（宿主机可见，删了即恢复）+ /tmp（内存盘，重启即空）。
    # ⚠️ 纪律：以后任何"往磁盘写点什么"的新功能，**必须**写进 CONFIG_HISTORY_DIR 那类
    #   挂载点内，或走 /tmp；否则线上表现为运行期 EROFS，而本机 `node server.js`
    #   完全正常（根fs 可写）——又一处"本机好好的、容器里报错"的距离很远的现象。
    read_only: true
    tmpfs:
      # Node 与 alpine 的临时文件落点（内存盘，容器一停就没了）。
      # 不挂这行：libuv / 某些 zlib 路径在只读根下取不到临时目录，表现为启动期 ENOENT/EROFS。
      - /tmp
    # 网关不需要任何 capability：监听 8787（>1024，不需要 NET_BIND_SERVICE）、
    # 不 chown（不需要 CHOWN）、不改网络栈（不需要 NET_ADMIN）、不跟踪进程（不需要 SYS_PTRACE）。
    # 全丢之后即使二进制里有提权原语也失效。
    cap_drop:
      - ALL
    # 禁止 setuid/setgid 程序提权：镜像里的 wget（healthcheck 用）不需要，给了只是攻击面。
    security_opt:
      - no-new-privileges:true
    networks:
      - zznet

# 固定子网 → 网桥网关 IP 恒为 172.28.137.1（反代采信模式下 config.security.trustedProxy 登记的就是它：
# 网关眼里"宿主机 nginx 经 Docker 转发直连进来"的源地址）。不固定子网的话 Docker 每次建网分到的
# 网段不同，trustedProxy 会静默失效（采信不到 X-Forwarded-For，来源统计又退回一行网桥 IP）。
networks:
  zznet:
    driver: bridge
    ipam:
      config:
        - subnet: ${ZZCSAPI_SUBNET:-172.28.137.0/24}

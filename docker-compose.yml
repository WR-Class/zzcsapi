services:
  zzcsapi:
    build: .
    image: zzcsapi:local
    container_name: zzcsapi
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
      PORT: "8787"
      ZZCSAPI_BIND: "0.0.0.0"
      ZZCSAPI_NOAUTH: ${ZZCSAPI_NOAUTH:-1}
      ADMIN_KEY: ${ZZCSAPI_ADMIN_KEY:-zz-admin-change-me}
      GATEWAY_KEY: ${ZZCSAPI_GATEWAY_KEY:-zz-gw-change-me}
      ZZCSAPI_CONFIG: /app/config.json
      # arena.ai 渠道走宿主机 arena-agent（真 Chrome sidecar，容器内 Chromium 的 TLS 指纹被 arena CF 拦截）
      ZZCSAPI_ARENA_AGENT: http://host.docker.internal:9225
    volumes:
      - ./config.json:/app/config.json
      - ./usage.json:/app/usage.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
